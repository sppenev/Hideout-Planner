<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hideout Planner Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Admin for the Hideout Planner room list. Same dark comic look as the planner. Keep this file on your own computer. */
:root{color-scheme:dark;--bg:#2a211a;--panel:#352a21;--panel-2:#2a211a;--line:#4d3d2f;--ink:#16120f;--paper:#fff8e8;--hint:#b9ab95;--hero:#ffcc2e;--hero-ink:#2a1d00;--bad:#ff5a4e;--ok:#5fd17a;
  --f-display:"Russo One","Rubik",system-ui,sans-serif;--f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:400;color:var(--hero);margin:0;font-size:28px;text-shadow:3px 3px 0 var(--ink)}
.hint{color:var(--hint);margin:0;max-width:80ch}
.bar{position:sticky;top:0;z-index:20;margin:-24px calc(50% - 50vw) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:rgba(42,33,26,.96);backdrop-filter:blur(4px);border-bottom:2px solid var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.bar-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.bar h1{font-size:22px}
.bar .state{max-width:1200px;margin:6px auto 0}
.bar .state:empty{display:none}
body{overflow-x:hidden}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--hero);color:var(--hero-ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hero);outline-offset:2px}
.state{font-size:12.5px;color:var(--ok);min-height:18px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:160px 130px minmax(150px,1fr) auto 70px 150px minmax(200px,1.4fr) auto;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:10px}
.thumb{width:160px;aspect-ratio:542/305;background:var(--panel-2);border-radius:6px;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--hint);font-size:11px;text-align:center}
.thumb.w2{aspect-ratio:1084/305}.thumb.w3{aspect-ratio:1626/305}.thumb.w4{aspect-ratio:2168/305}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--hint);font-weight:500}
label.check{flex-direction:row;align-items:center;gap:6px;font-size:12.5px;color:var(--paper)}
input[type=text],input[type=number],textarea{font:inherit;font-size:13px;color:var(--paper);background:var(--panel-2);border:2px solid var(--ink);border-radius:7px;padding:6px 8px;width:100%}
input[readonly]{opacity:.7}
textarea{height:56px;resize:vertical}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);width:32px;height:32px;font-weight:700}
.seg button.on{background:var(--hero);color:var(--hero-ink)}
.tag{font-size:11px;color:var(--hint)}
.err{color:var(--bad);font-size:11px}
.gh{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:12px 14px}
.gh summary{cursor:pointer;font-weight:700}
.gh[open] summary{margin-bottom:8px}
.ghgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0 10px}
.state.err{color:var(--bad)}
@media (max-width:1000px){.row{grid-template-columns:130px 1fr}.thumb{width:130px}.row>.wide{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar">
    <div class="bar-in">
      <h1>Стаи в планера</h1>
      <div class="btns">
        <a class="btn" href="Hideout-Planner.html" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Отвори сайта ↗</a>
        <button class="btn" id="add" type="button">+ Нова стая</button>
        <button class="btn primary" id="ghSave" type="button">Запази в сайта</button>
      </div>
    </div>
    <div class="state" id="state" aria-live="polite"></div>
  </div>
  <p class="hint">Тук редактираш стаите. „Запази в сайта“ записва промените направо в GitHub и до около минута се виждат на сайта.</p>
  <details class="gh" id="ghBox">
    <summary>Връзка с GitHub <span id="ghStatus" class="tag"></span></summary>
    <p class="hint">Попълни веднъж. Ключът се пази само в този браузър и не се записва в никой файл.</p>
    <div class="ghgrid">
      <label>Потребител в GitHub<input type="text" id="ghOwner" autocomplete="off" placeholder="напр. stilian"></label>
      <label>Хранилище<input type="text" id="ghRepo" autocomplete="off" placeholder="напр. hideout-planner"></label>
      <label>Клон<input type="text" id="ghBranch" autocomplete="off" value="main"></label>
      <label>Ключ (token)<input type="password" id="ghToken" autocomplete="off" placeholder="github_pat_..."></label>
    </div>
    <div class="btns"><button class="btn primary" id="ghConnect" type="button">Свържи</button><button class="btn danger" id="ghForget" type="button">Забрави ключа</button></div>
  </details>
  <div class="list" id="list"></div>
  <div class="btns"><button class="btn danger" id="reset" type="button">Започни отначало от rooms.js</button></div>
</div>

<script src="rooms.js"></script>
<script>
const KEY='hz-hideout-admin-v1';
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fromFile=()=>JSON.parse(JSON.stringify((window.ROOMS_CONFIG&&window.ROOMS_CONFIG.rooms)||[]));
let rooms;try{rooms=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){rooms=null}
if(!Array.isArray(rooms))rooms=fromFile();
function say(msg,err){$('state').textContent=msg||'';$('state').classList.toggle('err',!!err)}
function keep(msg){try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}say(msg||(gh.ok?'Има незапазени промени. Натисни „Запази в сайта“.':'Има незапазени промени. Свържи админа с GitHub, за да ги запазиш в сайта.'))}
/* ---- GitHub: read and write rooms.js in the repository ---- */
const GHKEY='hz-hideout-gh-v1';let gh={};try{gh=JSON.parse(localStorage.getItem(GHKEY)||'{}')||{}}catch(e){gh={}}
(function guess(){const m=location.hostname.match(/^([^.]+)\.github\.io$/);if(m&&!gh.owner){gh.owner=m[1];const seg=location.pathname.split('/').filter(Boolean);if(seg.length>1)gh.repo=seg[0]}})();
function ghUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+'/contents/rooms.js'}
function ghHeaders(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+gh.token,'X-GitHub-Api-Version':'2022-11-28'}}
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
function ghErr(r){return r.status===401?'Ключът не е валиден или е изтекъл.':r.status===403?'Ключът няма право да записва в това хранилище.':r.status===404?'Не намирам хранилището или файла rooms.js в него. Провери потребителя, хранилището и клона.':r.status===409?'Някой друг е записал междувременно. Опитай пак.':'GitHub върна грешка '+r.status+'.'}
async function ghGet(){const r=await fetch(ghUrl()+'?ref='+encodeURIComponent(gh.branch||'main')+'&t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});if(!r.ok)throw new Error(ghErr(r));const j=await r.json();
  const cfg=(new Function('window',b64d(j.content)+';return window.ROOMS_CONFIG'))({});return {sha:j.sha,rooms:(cfg&&cfg.rooms)||[]}}
function fileText(){return '/* Стаите в планера. Направен с admin.html. Сложи този файл до Hideout-Planner.html. */\nwindow.ROOMS_CONFIG='+JSON.stringify({version:1,rooms:rooms.map(({_new,...r})=>r)},null,1)+';\n'}
function ghShow(){$('ghOwner').value=gh.owner||'';$('ghRepo').value=gh.repo||'';$('ghBranch').value=gh.branch||'main';$('ghToken').value=gh.token||'';
  $('ghStatus').textContent=gh.ok?'· свързан с '+gh.owner+'/'+gh.repo:'· не е свързан';$('ghBox').open=!gh.ok}
$('ghConnect').onclick=async()=>{gh={owner:$('ghOwner').value.trim(),repo:$('ghRepo').value.trim(),branch:$('ghBranch').value.trim()||'main',token:$('ghToken').value.trim()};
  if(!gh.owner||!gh.repo||!gh.token){say('Попълни потребител, хранилище и ключ.',true);return}
  say('Свързвам се...');try{const g=await ghGet();gh.ok=true;try{localStorage.setItem(GHKEY,JSON.stringify(gh))}catch(e){}
    rooms=g.rooms;try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}render();ghShow();say('Свързано. Заредих стаите от сайта.')}
  catch(e){gh.ok=false;ghShow();say(e.message,true)}};
$('ghForget').onclick=()=>{gh={owner:gh.owner,repo:gh.repo,branch:gh.branch};try{localStorage.setItem(GHKEY,JSON.stringify(gh))}catch(e){}ghShow();say('Ключът е забравен в този браузър.')};
$('ghSave').onclick=async()=>{if(!gh.ok){$('ghBox').open=true;$('ghBox').scrollIntoView({block:'center',behavior:'smooth'});say('Първо свържи админа с GitHub: попълни ключа и натисни „Свържи“.',true);return}const bad=rooms.find(r=>!/^[a-z0-9_-]+$/.test(r.id));if(bad){say('Поправи името на файла на „'+bad.name+'“ преди да запазиш.',true);return}
  $('ghSave').disabled=true;say('Записвам в GitHub...');
  try{const cur=await ghGet();const r=await fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),
      body:JSON.stringify({message:'Стаи: промени от админа',content:b64e(fileText()),sha:cur.sha,branch:gh.branch||'main'})});
    if(!r.ok)throw new Error(ghErr(r));rooms.forEach(x=>delete x._new);try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}render();
    say('Записано в сайта. Обикновено до минута промените се виждат за всички.')}
  catch(e){say(e.message,true)}finally{$('ghSave').disabled=false}};
const EXTS=['png','jpg','jpeg','webp'];
function thumbImg(el,id,i=0){if(i>=EXTS.length){el.querySelector('img')?.remove();return}const im=el.querySelector('img')||el.appendChild(document.createElement('img'));im.alt='';
  im.onerror=()=>thumbImg(el,id,i+1);im.src='images/'+id+'.'+EXTS[i]}
function rowHTML(r,i){const isNew=!!r._new;
  return '<div class="row" data-i="'+i+'">'+
   '<div class="thumb w'+r.size+'">images/'+esc(r.id)+'.png</div>'+
   '<label>Име на файла<input type="text" data-k="id" value="'+esc(r.id)+'"'+(isNew?'':' readonly title="Името на файла не се сменя, за да не се загубят подредбите"')+' maxlength="24"><span class="err" data-err></span></label>'+
   '<label>Име<input type="text" data-k="name" maxlength="40" value="'+esc(r.name)+'"></label>'+
   '<div><div class="tag">Клетки</div><div class="seg">'+[1,2,3,4].map(n=>'<button type="button" data-size="'+n+'"'+(r.size===n?' class="on"':'')+'>'+n+'</button>').join('')+'</div></div>'+
   '<label>Лимит<input type="number" data-k="limit" min="1" max="20" value="'+r.limit+'"></label>'+
   (r.gen?'<div class="tag">Генератор: зарежда съседите си</div>':'<label class="check"><input type="checkbox" data-k="boost"'+(r.boost?' checked':'')+'> Генераторът я зарежда</label>')+
   '<label class="wide">Описание (в тултипа)<textarea data-k="desc" maxlength="240">'+esc(r.desc)+'</textarea></label>'+
   '<div class="wide"><button class="btn danger" type="button" data-del>Изтрий</button></div>'+
   '</div>'}
function render(){$('list').innerHTML=rooms.map(rowHTML).join('');document.querySelectorAll('.row').forEach(row=>{const r=rooms[+row.dataset.i];thumbImg(row.querySelector('.thumb'),r.id)})}
$('list').addEventListener('input',e=>{const row=e.target.closest('.row');if(!row)return;const r=rooms[+row.dataset.i],k=e.target.dataset.k;
  if(k==='name')r.name=e.target.value;
  else if(k==='desc')r.desc=e.target.value;
  else if(k==='limit')r.limit=Math.max(1,Math.min(20,+e.target.value||1));
  else if(k==='id'){const v=e.target.value.trim().toLowerCase(),er=row.querySelector('[data-err]');
    if(!/^[a-z0-9_-]+$/.test(v)){er.textContent='Само латински букви, цифри, - и _';return}
    if(rooms.some((x,j)=>x!==r&&x.id===v)){er.textContent='Това име вече е заето';return}
    er.textContent='';r.id=v;const th=row.querySelector('.thumb');th.firstChild&&th.firstChild.nodeType===3&&(th.firstChild.textContent='images/'+v+'.png');thumbImg(th,v)}
  keep()});
$('list').addEventListener('change',e=>{const row=e.target.closest('.row');if(!row)return;const r=rooms[+row.dataset.i];if(e.target.dataset.k==='boost'){r.boost=e.target.checked;keep()}});
$('list').addEventListener('click',e=>{const row=e.target.closest('.row');if(!row)return;const i=+row.dataset.i,r=rooms[i];
  const sb=e.target.closest('[data-size]');if(sb){r.size=+sb.dataset.size;keep();render();return}
  const del=e.target.closest('[data-del]');if(del){if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Сигурен ли си?';setTimeout(()=>{if(del.isConnected){del.classList.remove('armed');del.textContent='Изтрий'}},3000);return}
    rooms.splice(i,1);keep('Стаята е изтрита. Не забравяй да свалиш rooms.js.');render()}});
$('add').onclick=()=>{let n=1;while(rooms.some(r=>r.id==='room'+n))n++;rooms.push({id:'room'+n,name:'Нова стая',size:1,limit:1,boost:false,gen:false,desc:'',cat:'cus',_new:true});keep();render();
  const row=$('list').lastElementChild;row.scrollIntoView({block:'center',behavior:'smooth'});const inp=row.querySelector('[data-k="name"]');inp.focus();inp.select()};
ghShow();
let armed=false;$('reset').onclick=()=>{if(!armed){armed=true;$('reset').textContent='Натисни пак: ще се загубят незапазените промени';setTimeout(()=>{armed=false;$('reset').textContent='Започни отначало от rooms.js'},3000);return}
  armed=false;try{localStorage.removeItem(KEY)}catch(e){}
  if(gh.ok){ghGet().then(g=>{rooms=g.rooms;render();say('Заредено наново от сайта.')}).catch(e=>say(e.message,true))}else{rooms=fromFile();say('Заредено наново от rooms.js.')}$('reset').textContent='Започни отначало от rooms.js';render()};
if(gh.ok)ghGet().then(g=>{let draft=null;try{draft=localStorage.getItem(KEY)}catch(e){}if(!draft||draft===JSON.stringify(g.rooms)){rooms=g.rooms;render()}}).catch(e=>say(e.message,true));
else if(!window.ROOMS_CONFIG)$('state').textContent='Не намирам rooms.js до тази страница. Сложи admin.html в същата папка като Hideout-Planner.html и rooms.js.';
render();
</script>
</body>
</html>
